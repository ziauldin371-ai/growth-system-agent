name: Scheduled Outreach Run

on:
  schedule:
    # 09:00 and 17:00 Asia/Karachi (04:00 and 12:00 UTC)
    - cron: '0 4,12 * * *'
  workflow_dispatch:
    inputs:
      operating_mode:
        description: 'Operating Mode Override (optional: research | approval | auto_send)'
        required: false
        default: ''
        type: choice
        options:
          - ''
          - 'research'
          - 'approval'
          - 'auto_send'

jobs:
  run-outreach-schedule:
    name: Execute Autonomous Outreach Cycle
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Validate Secrets Configuration
        run: |
          if [ -z "${{ secrets.APP_BASE_URL }}" ]; then
            echo "::error::Missing required secret: APP_BASE_URL (e.g. https://your-domain.vercel.app)"
            exit 1
          fi
          if [ -z "${{ secrets.CRON_SECRET }}" ]; then
            echo "::error::Missing required secret: CRON_SECRET"
            exit 1
          fi
          echo "Configuration validated: Target URL configured via APP_BASE_URL secret."

      - name: Trigger Scheduled Automation API
        id: trigger_api
        run: |
          TARGET_URL="${{ secrets.APP_BASE_URL }}/api/cron/scheduled-run"
          echo "Dispatching POST request to: $TARGET_URL"
          echo "Execution timestamp (UTC): $(date -u '+%Y-%m-%d %H:%M:%S UTC')"

          # Prepare JSON payload with trigger metadata
          PAYLOAD='{"triggeredBy": "github_actions", "modeOverride": "${{ github.event.inputs.operating_mode }}"}'

          # Execute curl with HTTP status capture and response output
          RESPONSE_FILE=$(mktemp)
          HTTP_STATUS=$(curl -s -o "$RESPONSE_FILE" -w "%{http_code}" -X POST "$TARGET_URL" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            -H "Content-Type: application/json" \
            -H "User-Agent: GrowthSystemAgent-GitHubActions/1.0" \
            -d "$PAYLOAD")

          echo "HTTP Status Code: $HTTP_STATUS"
          echo "Response Payload:"
          cat "$RESPONSE_FILE"
          echo ""

          if [ "$HTTP_STATUS" -ne 200 ]; then
            echo "::error::Scheduled run failed with HTTP status $HTTP_STATUS"
            cat "$RESPONSE_FILE"
            exit 1
          fi

          echo "Scheduled run dispatched and completed successfully."
