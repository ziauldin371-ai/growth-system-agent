name: Scheduled Twice-Daily Automation Run

on:
  schedule:
    # 09:00 & 17:00 Pakistan Standard Time (PKT, UTC+5)
    # Corresponds to 04:00 & 12:00 UTC
    - cron: '0 4,12 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

jobs:
  trigger-automation:
    name: Execute Twice-Daily Growth Pipeline
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Scheduled Automation Endpoint
        run: |
          APP_URL="${{ secrets.APP_BASE_URL || 'https://growth-system-agent.vercel.app' }}"
          CRON_SECRET="${{ secrets.CRON_SECRET }}"

          echo "Triggering automated discovery, scoring, and dispatch pipeline..."
          RESPONSE=$(curl -s -w "\n%{http_code}" -X POST "${APP_URL}/api/cron/scheduled-run" \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            -H "Content-Type: application/json")

          HTTP_BODY=$(echo "$RESPONSE" | sed '$d')
          HTTP_STATUS=$(echo "$RESPONSE" | tail -n 1)

          echo "HTTP Response Status: $HTTP_STATUS"
          echo "Response Body: $HTTP_BODY"

          if [ "$HTTP_STATUS" -ne 200 ]; then
            echo "::error::Scheduler run failed with status $HTTP_STATUS"
            exit 1
          fi

          echo "Twice-daily scheduled run completed successfully."

